<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Anywhere - AI Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="slide">
    <section class="banner gap-lg">
      <h1 class="title simple">Works with AI chats too.</h1>
      <p class="subtitle">Fully functional with Gemini, xAI, DeepSeek, Claude, and ChatGPT.</p>

      <div class="tool-grid" aria-label="Supported AI tools">
        <div class="tool-chip" aria-label="Gemini">
          <img src="./assets/gemini.svg" alt="Gemini">
        </div>
        <div class="tool-chip" aria-label="xAI">
          <img src="./assets/xai.svg" alt="xAI">
        </div>
        <div class="tool-chip" aria-label="DeepSeek">
          <img src="./assets/deepseek.svg" alt="DeepSeek">
        </div>
        <div class="tool-chip" aria-label="Claude">
          <img src="./assets/claude.svg" alt="Claude">
        </div>
        <div class="tool-chip" aria-label="ChatGPT">
          <img src="./assets/openai.svg" alt="ChatGPT">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
