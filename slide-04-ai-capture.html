<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotionSesh — Redesigned</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --terracotta: #d4734a;
      --burnt-orange: #e67e3d;
      --ink: #231912;
      --muted: #726962;
      --line: #e9e2d9;
      --shadow: 0 12px 32px rgba(35, 25, 18, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-container {
      width: 1280px;
      height: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .header-group {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .sparkle-icon {
      width: 48px;
      height: 48px;
      color: var(--terracotta);
      margin-bottom: 2px;
    }

    h1 {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      font-size: 82px;
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-wrap: balance;
    }

    .subtext {
      font-size: 24px;
      color: var(--muted);
      font-weight: 500;
      max-width: 32ch;
      line-height: 1.35;
      text-wrap: balance;
    }

    .capture-stage {
      position: relative;
      width: 900px;
      height: 460px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
    }

    .document-layer {
      width: 100%;
      height: 100%;
      background-image: url('https://alfredjustus.com/mathPDF.png');
      background-size: cover;
      background-position: center 20%;
    }

    .selection-box {
      position: absolute;
      top: 26%;
      left: 5%;
      width: 90%;
      height: 65%;
      border: 3.5px solid var(--terracotta);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(45, 36, 22, 0.65); 
      z-index: 20;
      animation: selection-pulse 2s ease-in-out infinite;
    }

    @keyframes selection-pulse {
      0%, 100% { 
        border-color: var(--terracotta);
        box-shadow: 0 0 0 9999px rgba(45, 36, 22, 0.65); 
      }
      50% { 
        border-color: var(--burnt-orange);
        box-shadow: 0 0 0 9999px rgba(45, 36, 22, 0.7); 
      }
    }

    /* ─── AI Extraction UI ─── */
    .ai-toolbar {
      position: absolute;
      bottom: -35px; 
      right: -20px;
      background: var(--ink);
      padding: 10px;
      border-radius: 20px;
      box-shadow:
        0 10px 28px rgba(35, 25, 18, 0.18);
      border: 1.5px solid rgba(212, 115, 74, 0.2);
      display: flex;
      align-items: center;
      z-index: 30;
    }

    .extract-btn {
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--burnt-orange) 100%);
      color: #ffffff;
      padding: 14px 36px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      box-shadow:
        0 2px 8px rgba(212, 115, 74, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .extract-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 
        0 8px 24px rgba(212, 115, 74, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .notion-logo-sm { 
      width: 22px; 
      height: 22px; 
    }

    .features-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
    }

    .feature-pill {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 18px 34px;
      border-radius: 100px;
      color: var(--ink);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 14px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <div class="slide-container">
    
    <div class="header-group">
      <svg class="sparkle-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" /> 
        <path d="M4 2L5 5L8 6L5 7L4 10L3 7L0 6L3 5L4 2Z" transform="translate(18, 0)" /> 
        <path d="M4 2L5 5L8 6L5 7L4 10L3 7L0 6L3 5L4 2Z" transform="translate(0, 16)" /> 
      </svg>
      
      <h1>Capture images and PDFs.</h1>
      <!-- <p class="subtext">
        Drag to select charts, tables, or math. AI converts pixels perfectly.
      </p> -->
    </div>

    <div class="capture-stage">
      <div class="document-layer"></div>
      
      <div class="selection-box">
        <div class="ai-toolbar">
          <div class="extract-btn">
            
            AI Extract
          </div>
        </div>
      </div>
    </div>

    <div class="features-row">
      <div class="feature-pill">PDFs and Slides</div>
      <div class="feature-pill">Smart OCR</div>
      <div class="feature-pill">Perfect Formatting</div>
    </div>

  </div>

</body>
</html>
