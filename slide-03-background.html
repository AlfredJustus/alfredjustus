<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Anywhere - Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf7f2;
      --panel: #ffffff;
      --ink: #231912;
      --muted: #726962;
      --line: #e9e2d9;
      --shadow: 0 12px 32px rgba(35, 25, 18, 0.06);
      --accent: #d4734a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 1280px;
      height: 800px;
      margin: 0 auto;
      padding: 52px 64px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }

    /* key combo */
    .key-combo {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      min-width: 44px;
      padding: 0 14px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom-width: 3px;
      box-shadow: var(--shadow);
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .key-sep {
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      margin: 0 2px;
    }

    .title {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      font-size: 74px;
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-wrap: balance;
    }

    .subtitle {
      margin: 0;
      max-width: 32ch;
      color: var(--muted);
      font-size: 24px;
      line-height: 1.35;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main class="slide">
    <section class="banner">

      <div class="key-combo">
        <div class="key">⌘</div>
        <span class="key-sep">/</span>
        <div class="key">Ctrl</div>
        <div class="key">C</div>
      </div>

      <h1 class="title simple">Install it once.<br>Forget about it.</h1>
      <p class="subtitle">Works in the background. Just paste and it's done.</p>

    </section>
  </main>
</body>
</html>
