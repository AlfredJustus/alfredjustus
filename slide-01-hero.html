<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Anywhere - Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="slide">
    <section class="banner gap-lg">
      <h1 class="title">Copy anything.<br>Paste anywhere.</h1>
      <p class="subtitle">Math, tables, code, and formatted text for your document editor.</p>

      <div class="hero-types" aria-label="Supported content types">
        <div class="type-card math">
          <div class="math-badge">x² + y²</div>
        </div>
        <div class="type-card code">
          <div class="code-badge"><span>&lt;</span><span>/&gt;</span></div>
        </div>
        <div class="type-card table">
          <div class="table-badge" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="logo-row" aria-label="Supported editors">
        <div class="logo-chip">
          <img src="./assets/docs.svg" alt="">
          <span>Google Docs</span>
        </div>
        <div class="logo-chip">
          <img src="./assets/notion-logo.svg" alt="">
          <span>Notion</span>
        </div>
        <div class="logo-chip">
          <img src="./assets/obsidian-logo.svg" alt="">
          <span>Obsidian</span>
        </div>
        <div class="logo-chip">
          <span>Any editor</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
