<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotionSesh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <script data-goatcounter="https://alfredjustus.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <style>
    :root {
      --terracotta: #d4734a;
      --deep-clay: #2d2416;
      --cream: #fef9f3;
      --burnt-orange: #e67e3d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100%;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(135deg, #fef9f3 0%, #f9f3ea 50%, #f4ede3 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 60px 20px;
    }

    /* Organic paper texture overlay */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1;
    }

    .slide-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 2;
    }

    /* ─── Typography ─── */
    .header-group { text-align: center; }

    h1 {
      font-family: 'Source Serif 4', serif;
      font-size: clamp(48px, 9vw, 82px);
      font-weight: 700;
      color: var(--deep-clay);
      line-height: 1.1;
      margin-bottom: 16px;
    }

    p.subtext {
      font-size: clamp(18px, 4vw, 24px);
      color: rgba(45, 36, 22, 0.68);
      font-weight: 500;
      max-width: 600px;
      margin: 0 auto 32px auto;
      line-height: 1.4;
    }

    /* ─── Improved Button Formatting ─── */
    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 180px;
      border: 2px solid transparent;
    }

    /* Primary: The Main Action */
    .btn-primary {
      background: var(--terracotta);
      color: white;
      box-shadow: 0 4px 14px rgba(212, 115, 74, 0.25);
    }

    .btn-primary:hover {
      background: var(--burnt-orange);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 115, 74, 0.35);
    }

    /* Secondary: The Tutorial/Information */
    .btn-secondary {
      background: transparent;
      color: var(--deep-clay);
      border-color: rgba(45, 36, 22, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(45, 36, 22, 0.04);
      border-color: rgba(45, 36, 22, 0.3);
      transform: translateY(-2px);
    }

    /* ─── Card Components ─── */
    .cards-row {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 960px;
      justify-content: center;
      margin-top: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(45, 36, 22, 0.08);
      border: 2px solid rgba(45, 36, 22, 0.06);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(212, 115, 74, 0.15);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .badge.source { background: rgba(45, 36, 22, 0.08); color: var(--deep-clay); }
    .badge.notion { background: rgba(212, 115, 74, 0.12); color: var(--terracotta); }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--deep-clay);
    }

    .image-frame {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(45, 36, 22, 0.08);
    }

    .image-frame img { width: 100%; display: block; }

    .arrow-container {
      color: var(--terracotta);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Mobile Specific ─── */
    @media (max-width: 768px) {
      .cards-row { flex-direction: column; }
      .arrow-container { transform: rotate(90deg); margin: -10px 0; }
      .card { width: 100%; max-width: 400px; }
      .button-group { flex-direction: column; align-items: stretch; }
      .btn { min-width: 100%; }
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      font-weight: 700;
      color: var(--deep-clay);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 2;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    footer a {
      color: var(--deep-clay);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    footer a:hover {
      opacity: 1;
      color: var(--terracotta);
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <div class="header-group">
      <h1>NotionSesh</h1>
      <p class="subtext">Chrome sidepanel for quick notes and exports to Notion.</p>
      
      <div class="button-group">
        <a href="https://chromewebstore.google.com/detail/notionsesh/eilfiamdpkcphkpcaihiclafoecpmodn" class="btn btn-primary">Install in Browser</a>
        <a href="/notionsesh/intro" class="btn btn-secondary">Tutorial</a>
      </div>
    </div>

    <div class="cards-row">
      <div class="card">
        <div class="card-header">
          <span class="badge source">Input</span>
          <span class="card-title">PDF / Website</span>
        </div>
        <div class="image-frame">
          <img src="https://alfredjustus.com/mathPDF.png" alt="Source">
        </div>
      </div>

      <div class="arrow-container">
        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="badge notion">Result</span>
          <span class="card-title">Notion</span>
          <img src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Notion-logo.svg" style="width:18px; height:18px; margin-left:auto;">
        </div>
        <div class="image-frame">
          <img src="https://alfredjustus.com/mathNotion.png" alt="Result">
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span>&copy; 2026 Alfred Justus</span>
    <a href="privacy/">Privacy Policy</a>
  </footer>

</body>
</html>
